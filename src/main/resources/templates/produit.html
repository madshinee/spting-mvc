<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des Produits</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        a { text-decoration: none; color: #0066cc; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>Liste des Produits</h1>
    <a th:href="@{/produit/new}">Ajouter un produit</a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Libelle</th>
                <th>Prix</th>
                <th>Type Produit</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="product : ${produits}">
                <td th:text="${product.id}">1</td>
                <td th:text="${product.libelle}">Libelle</td>
                <td th:text="${product.prix}">100</td>
                <td th:text="${product.typeProduit != null ? product.typeProduit.libelle : 'Non défini'}">Non défini</td>
                <td>
                    <a th:href="@{/produit/edit/{id}(id=${product.id})}">Modifier</a>
                    <form th:action="@{/produit/delete/{id}(id=${product.id})}" method="post" style="display:inline;">
                        <input type="hidden" name="_method" value="DELETE">
                        <input type="submit" value="Supprimer" onclick="return confirm('Êtes-vous sûr de vouloir supprimer ce produit ?');" />
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
